name: build

# Runs only when you push to main or press "Run workflow". There is deliberately no
# pull_request trigger, so nobody else can run it or reach the signing-key secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# No workflow-wide queue: a slow runner (GitHub's macOS ones can wait a long time for a free machine) must not
# hold up the next build. Publishing is serialised instead, in the release job below.

jobs:
  # ---------------------------------------------------------------- the Android app
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Third-party steps are pinned to exact commits (tag in the comment), so a moved
      # or hijacked tag can't swap in different code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "8.11.1"

      - name: Signing key
        env:
          KS: ${{ secrets.DEBLOATER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/debloater.jks"
            echo "DEBLOATER_KEYSTORE=$RUNNER_TEMP/debloater.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBLOATER_KEYSTORE_B64 secret not set; signing with a throwaway debug key. The setup tool will refuse to install it."
          fi

      - name: Check the key matches the one the setup tool trusts
        if: env.DEBLOATER_KEYSTORE != ''
        env:
          DEBLOATER_KEYSTORE_PASSWORD: ${{ secrets.DEBLOATER_KEYSTORE_PASSWORD }}
        run: |
          keytool -exportcert -keystore "$DEBLOATER_KEYSTORE" -alias debloater \
            -storepass:env DEBLOATER_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/cert.der"
          actual=$(sha256sum "$RUNNER_TEMP/cert.der" | cut -d' ' -f1)
          expected=$(tr -d '[:space:]' < tool/trusted_signer.sha256)
          if [ "$actual" != "$expected" ]; then
            echo "::error::The signing key's fingerprint ($actual) doesn't match tool/trusted_signer.sha256 ($expected). Put the right fingerprint in that file."
            exit 1
          fi

      - name: Build
        env:
          DEBLOATER_KEYSTORE_PASSWORD: ${{ secrets.DEBLOATER_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk honorless-debloater.apk

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/debloater.jks" "$RUNNER_TEMP/cert.der"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: apk
          path: honorless-debloater.apk

  # ------------------------------------------------- the setup tool, packaged per OS
  tool:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # Every package (and its dependencies) is pinned to an exact version and file hash, so a
      # compromised upstream release can't end up inside the tool people download.
      - name: Install the packager
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r tool/requirements-build.txt

      - name: Record where updates come from
        shell: bash
        run: |
          printf '{"repo": "%s", "version": "1.0.%s"}\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER" > tool/build_info.json
          cat tool/build_info.json

      - name: Package
        shell: bash
        run: |
          sep=":"; mode="--onefile"; icon=""
          [ "$RUNNER_OS" = "Windows" ] && sep=";" && icon="--icon tool/icons/icon.ico"
          [ "$RUNNER_OS" = "macOS" ] && mode="--onedir" && icon="--icon tool/icons/icon.icns"
          # The same shield icon as the tablet app: in the file itself (Windows, macOS) and on the window (all).
          python -m PyInstaller --noconfirm --clean $mode --windowed --name HonorlessDebloater-Setup $icon \
            --add-data "tool/trusted_signer.sha256${sep}." --add-data "tool/build_info.json${sep}." \
            --add-data "tool/icons/icon.png${sep}icons" \
            --hidden-import certifi tool/debloater_setup.py

      - name: Collect
        shell: bash
        run: |
          mkdir out
          case "$RUNNER_OS" in
            Windows) cp dist/HonorlessDebloater-Setup.exe out/HonorlessDebloater-Setup-Windows.exe ;;
            macOS)   (cd dist && ditto -c -k --keepParent HonorlessDebloater-Setup.app ../out/HonorlessDebloater-Setup-macOS.zip) ;;
            Linux)   cp dist/HonorlessDebloater-Setup out/HonorlessDebloater-Setup-Linux && chmod +x out/HonorlessDebloater-Setup-Linux ;;
          esac

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tool-${{ matrix.label }}
          path: out/*

  # ------------------------------------------------------------------- the release
  # Published as soon as the app is built, so the tablet's self-update gets it without waiting for the setup tools.
  release:
    needs: [apk]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}   # one publish at a time, so two quick pushes can't race
      cancel-in-progress: false
    permissions:
      contents: write   # needed to publish the release
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: apk
          path: dist

      - name: Publish release v1.0.N
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          # Older builds used one rolling release called "latest"; remove it so it can't be confused with this one.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          # If this build is being re-run, replace its own earlier (possibly partial) release.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cat > notes.md <<EOF
          **Start here:** download the setup tool for your computer, run it, and follow the steps.

          | Your computer | Download |
          |---|---|
          | Windows | \`HonorlessDebloater-Setup-Windows.exe\` |
          | Mac (Apple silicon) | \`HonorlessDebloater-Setup-macOS.zip\` |
          | Linux | \`HonorlessDebloater-Setup-Linux\` |

          The tool installs (or updates) \`honorless-debloater.apk\` on the tablet for you. \`SHA256SUMS.txt\` lists every file's checksum.
          The setup tools are added a few minutes after the app; if one isn't here yet, check back shortly.
          Full guide: see the README.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Honorless Debloater $tag" \
            --notes-file notes.md --latest

  # Adds the setup tools to the release once they're built. A tool that failed or never got a machine is left out
  # (the others are still added), and SHA256SUMS.txt is rewritten to cover everything that's there.
  attach-tools:
    needs: [release, tool]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      - name: Add the setup tools to v1.0.N
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          ls -la dist
          tools=$(cd dist && ls HonorlessDebloater-Setup-* 2>/dev/null || true)
          if [ -z "$tools" ]; then echo "::warning::No setup tools were built this time."; exit 0; fi
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          (cd dist && gh release upload "$tag" $tools SHA256SUMS.txt --clobber)
